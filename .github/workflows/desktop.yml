# GitHub에 올리면 Windows/Mac 앱을 자동으로 빌드합니다.
# Actions 탭 → 실행 결과 → Artifacts 에서 다운로드. v* 태그를 push 하면 Releases 에도 올라갑니다.
name: Build desktop app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]   # macos-latest = Apple Silicon(arm64)
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-desktop.txt
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Force packaging/ffmpeg/bin | Out-Null
          Copy-Item ffmpeg_tmp/*/bin/ffmpeg.exe, ffmpeg_tmp/*/bin/ffprobe.exe packaging/ffmpeg/bin/
      - name: ffmpeg (macOS, Apple Silicon)
        if: runner.os == 'macOS'
        continue-on-error: true   # 실패하면 ffmpeg 없이 빌드 → 앱 설정 화면에서 설치
        run: |
          mkdir -p packaging/ffmpeg/bin
          curl -fL https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip -o ff.zip
          curl -fL https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffprobe.zip -o fp.zip
          unzip -o ff.zip -d packaging/ffmpeg/bin && unzip -o fp.zip -d packaging/ffmpeg/bin
          chmod +x packaging/ffmpeg/bin/*
          packaging/ffmpeg/bin/ffmpeg -hide_banner -filters | grep -q " ass " || (echo "no libass" && rm -rf packaging/ffmpeg && exit 1)
          file packaging/ffmpeg/bin/ffmpeg
      - run: pyinstaller packaging/ytgen.spec --noconfirm
      - name: zip
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a ../ytgen-studio-windows.zip ytgen-studio; else ditto -c -k --keepParent "ytgen Studio.app" ../ytgen-studio-mac.zip; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ytgen-studio-${{ runner.os }}
          path: ytgen-studio-*.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ytgen-studio-*.zip
